<meta charset="UTF-8">

<title>外展人員轄區查詢</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    min-height: 100vh;
    background: linear-gradient(145deg, #FDEEE6 0%, #FDF8F4 30%, #EAF8F8 70%, #C8EDEF 100%);
    padding: 32px 24px 60px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(120deg, #E8855A 0%, #F4B896 40%, #7DD4D8 100%);
    border-radius: 16px;
    padding: 28px 32px 22px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(232,133,90,0.22);
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .header p {
    font-size: 13px;
    color: rgba(255,255,255,0.88);
  }

  /* ── Search ── */
  .search-wrap {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 24px;
  }
  .search-wrap input {
    width: 300px;
    font-size: 16px;
    font-family: inherit;
    padding: 10px 16px;
    border: 1.5px solid #7DD4D8;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.92);
    color: #2a4a50;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-wrap input:focus { border-color: #5BBFC4; box-shadow: 0 0 0 3px rgba(91,191,196,0.15); }
  .count-badge {
    background: #FEF0E6;
    color: #C05A20;
    border: 1px solid #F4B896;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── District buttons ── */
  .section-label {
    font-size: 15px;
    font-weight: 600;
    color: #3A6E72;
    margin-bottom: 10px;
  }
  .district-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .dist-btn {
    background: rgba(255,255,255,0.85);
    border: 1.5px solid #F4B896;
    border-radius: 10px;
    padding: 9px 20px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    color: #C05A20;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    backdrop-filter: blur(4px);
  }
  .dist-btn:hover { background: #FEF0E6; box-shadow: 0 2px 8px rgba(232,133,90,0.18); }
  .dist-btn.active {
    background: linear-gradient(120deg, #5BBFC4, #7DD4D8);
    color: #fff;
    border-color: #4AADB2;
    box-shadow: 0 2px 10px rgba(91,191,196,0.3);
  }

  /* ── Results panel ── */
  .divider { border: none; border-top: 1.5px solid #C0E8EB; margin: 0 0 20px; }
  .panel {
    background: rgba(255,255,255,0.70);
    border-radius: 14px;
    padding: 20px 22px;
    min-height: 80px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(125,212,216,0.3);
    box-shadow: 0 2px 16px rgba(91,191,196,0.10);
  }

  .hint { color: #5a8c8e; font-size: 15px; }
  .no-result { color: #b04010; font-size: 15px; }

  /* District view */
  .person-section { margin-bottom: 20px; }
  .person-header {
    display: inline-block;
    background: linear-gradient(90deg, #7DD4D8, #A8E0E3);
    color: #1a4a4e;
    border-radius: 8px;
    padding: 6px 18px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(91,191,196,0.2);
  }
  .village-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .v-chip {
    background: rgba(255,255,255,0.88);
    border: 1px solid #A8E0E3;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #2a4a50;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .v-chip:hover { background: #FEF0E6; color: #C05A20; border-color: #F4B896; }

  /* Search result cards */
  .result-card {
    background: rgba(255,255,255,0.88);
    border: 1px solid #A8E0E3;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    box-shadow: 0 1px 6px rgba(91,191,196,0.10);
  }
  .result-card:last-child { margin-bottom: 0; }
  .result-village {
    font-size: 18px;
    font-weight: 700;
    color: #1a4a4e;
    margin-bottom: 6px;
  }
  .result-row {
    font-size: 14px;
    color: #4a7a7e;
    margin: 3px 0;
  }
  .result-row strong { color: #2a5a5e; }
  .tag {
    display: inline-block;
    background: #FEF0E6;
    color: #C05A20;
    border-radius: 6px;
    padding: 1px 10px;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>

const districtMap = {};
data.forEach(d => {
  if (!districtMap[d.district]) districtMap[d.district] = {};
  if (!districtMap[d.district][d.person]) districtMap[d.district][d.person] = [];
  districtMap[d.district][d.person].push(d.village);
});

const districtOrder = ["彰化市","和美鎮","鹿港鎮","福興鄉","伸港鄉","線西鄉","秀水鄉","芬園鄉","花壇鄉"];
let activeDistrict = null;

const btnsEl = document.getElementById('distBtns');
districtOrder.forEach(d => {
  const b = document.createElement('button');
  b.className = 'dist-btn';
  b.textContent = d;
  b.onclick = () => selectDistrict(d, b);
  btnsEl.appendChild(b);
});

function selectDistrict(d, btn) {
  if (activeDistrict === d) {
    activeDistrict = null;
    btn.classList.remove('active');
    document.getElementById('searchInput').value = '';
    document.getElementById('results').innerHTML = '<p class="hint">輸入村里名稱，或點選上方鄉鎮市按鈕查詢</p>';
    document.getElementById('countBadge').textContent = '共 230 筆';
    return;
  }
  activeDistrict = d;
  document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  showDistrict(d);
}

function showDistrict(d) {
  const persons = districtMap[d];
  if (!persons) return;
  const total = Object.values(persons).flat().length;
  document.getElementById('countBadge').textContent = d + '　' + total + ' 筆';
  let html = '';
  Object.entries(persons).forEach(([person, villages]) => {
    const chips = villages.map(v => '<span class="v-chip" onclick="searchVillage(\'' + v + '\')">' + v + '</span>').join('');
    html += '<div class="person-section"><div class="person-header">' + person + '</div><div class="village-grid">' + chips + '</div></div>';
  });
  document.getElementById('results').innerHTML = html;
}

function searchVillage(v) {
  document.getElementById('searchInput').value = v;
  document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
  activeDistrict = null;
  onSearch();
}

function onSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) {
    document.getElementById('results').innerHTML = '<p class="hint">輸入村里名稱，或點選上方鄉鎮市按鈕查詢</p>';
    document.getElementById('countBadge').textContent = '共 230 筆';
    document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
    activeDistrict = null;
    return;
  }
  document.querySelectorAll('.dist-btn').forEach(b => b.classList.remove('active'));
  activeDistrict = null;
  const matches = data.filter(d => d.village.includes(q));
  document.getElementById('countBadge').textContent = '找到 ' + matches.length + ' 筆';
  if (matches.length === 0) {
    document.getElementById('results').innerHTML = '<p class="no-result">找不到符合的村里，請確認名稱是否正確。</p>';
    return;
  }
  document.getElementById('results').innerHTML = matches.map(m =>
    '<div class="result-card">' +
    '<div class="result-village">' + m.village + '</div>' +
    '<div class="result-row">承辦人員：<strong>' + m.person + '</strong></div>' +
    '<div class="result-row">轄區：<span class="tag">' + m.district + '</span></div>' +
    '</div>'
  ).join('');
}
